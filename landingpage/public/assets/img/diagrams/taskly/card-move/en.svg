<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" role="img" aria-labelledby="t d">
<title id="t">Taskly · Moving a card</title>
<desc id="d">Sequence diagram. The board moves the card at once and sends a transition carrying the row version it read. Permission attributes run and the command reaches its handler, which loads the card, applies the business rules and saves with the row version in the WHERE clause. On success it tells every contributor’s board over SignalR, and the other board reloads. If someone saved first, no row matches, the API answers 409 and the board reloads to show their version.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
<rect width="1280" height="840" rx="18" fill="#0b1119"/>
<text x="40" y="52" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#e8eef6" text-anchor="start">Taskly</text><text x="40" y="74" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#9fb0c3" text-anchor="start">One card dragged to another column, checked against what its mover saw, then shown to everyone</text><path d="M140,160 L140,810" stroke="#2b3a4d" stroke-width="1.4" stroke-dasharray="5 6"/><rect x="46" y="110" width="200" height="56" rx="10" fill="#2b6068"/><rect x="40" y="104" width="200" height="56" rx="10" fill="#192e3a" stroke="#56cdd6" stroke-width="1.8"/><text x="140" y="129" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14.5" font-weight="700" fill="#e8eef6" text-anchor="middle">Board</text><text x="140" y="148" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#7e91a8" text-anchor="middle">the mover’s browser</text><path d="M390,160 L390,810" stroke="#2b3a4d" stroke-width="1.4" stroke-dasharray="5 6"/><rect x="296" y="110" width="200" height="56" rx="10" fill="#284b72"/><rect x="290" y="104" width="200" height="56" rx="10" fill="#18293d" stroke="#4f9bec" stroke-width="1.8"/><text x="390" y="129" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14.5" font-weight="700" fill="#e8eef6" text-anchor="middle">Taskly.Api</text><text x="390" y="148" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#7e91a8" text-anchor="middle">controller</text><path d="M640,160 L640,810" stroke="#2b3a4d" stroke-width="1.4" stroke-dasharray="5 6"/><rect x="546" y="110" width="200" height="56" rx="10" fill="#284b72"/><rect x="540" y="104" width="200" height="56" rx="10" fill="#18293d" stroke="#4f9bec" stroke-width="1.8"/><text x="640" y="129" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14.5" font-weight="700" fill="#e8eef6" text-anchor="middle">Handler</text><text x="640" y="148" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#7e91a8" text-anchor="middle">Taskly.Logic</text><path d="M890,160 L890,810" stroke="#2b3a4d" stroke-width="1.4" stroke-dasharray="5 6"/><rect x="796" y="110" width="200" height="56" rx="10" fill="#426250"/><rect x="790" y="104" width="200" height="56" rx="10" fill="#1f2e35" stroke="#8fd39d" stroke-width="1.8"/><text x="890" y="129" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14.5" font-weight="700" fill="#e8eef6" text-anchor="middle">SQL Server</text><text x="890" y="148" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#7e91a8" text-anchor="middle">EF Core</text><path d="M1150,160 L1150,810" stroke="#2b3a4d" stroke-width="1.4" stroke-dasharray="5 6"/><rect x="1056" y="110" width="200" height="56" rx="10" fill="#2b6068"/><rect x="1050" y="104" width="200" height="56" rx="10" fill="#192e3a" stroke="#56cdd6" stroke-width="1.8"/><text x="1150" y="129" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14.5" font-weight="700" fill="#e8eef6" text-anchor="middle">Other board</text><text x="1150" y="148" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#7e91a8" text-anchor="middle">a teammate’s browser</text><rect x="138" y="179" width="10" height="62" rx="2" fill="#284b72"/><rect x="135" y="176" width="10" height="62" rx="2" fill="#244264" stroke="#4f9bec" stroke-width="1.8"/><rect x="388" y="235" width="10" height="408" rx="2" fill="#284b72"/><rect x="385" y="232" width="10" height="408" rx="2" fill="#244264" stroke="#4f9bec" stroke-width="1.8"/><rect x="638" y="279" width="10" height="328" rx="2" fill="#284b72"/><rect x="635" y="276" width="10" height="328" rx="2" fill="#244264" stroke="#4f9bec" stroke-width="1.8"/><rect x="888" y="323" width="10" height="44" rx="2" fill="#284b72"/><rect x="885" y="320" width="10" height="44" rx="2" fill="#244264" stroke="#4f9bec" stroke-width="1.8"/><rect x="888" y="451" width="10" height="46" rx="2" fill="#284b72"/><rect x="885" y="448" width="10" height="46" rx="2" fill="#244264" stroke="#4f9bec" stroke-width="1.8"/><rect x="1148" y="533" width="10" height="60" rx="2" fill="#284b72"/><rect x="1145" y="530" width="10" height="60" rx="2" fill="#244264" stroke="#4f9bec" stroke-width="1.8"/><path d="M145,180 L180,180 L180,202 L148,202" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190" y="195" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="start">the card moves at once</text><path d="M145,236 L383,236" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="265" y="228" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="400" fill="#e8eef6" text-anchor="middle">PATCH transition + rowVersion</text><path d="M395,282 L633,282" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="515" y="274" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">permissions pass, dispatch</text><path d="M645,326 L883,326" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="765" y="318" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">load the card</text><path d="M885,360 L647,360" fill="none" stroke="#7e91a8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/><text x="765" y="352" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="400" fill="#9fb0c3" text-anchor="middle">row</text><path d="M645,392 L680,392 L680,414 L648,414" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="690" y="407" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="start">apply rules: epic, completion</text><path d="M645,454 L883,454" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="765" y="446" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="10.5" font-weight="400" fill="#e8eef6" text-anchor="middle">UPDATE … WHERE RowVersion = @seen</text><path d="M885,490 L647,490" fill="none" stroke="#7e91a8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/><text x="765" y="482" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="400" fill="#9fb0c3" text-anchor="middle">1 row</text><path d="M645,530 L1143,530" fill="none" stroke="#56cdd6" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-teal)"/><text x="895" y="522" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="400" fill="#56cdd6" text-anchor="middle">BoardChanged (SignalR)</text><path d="M1145,556 L1110,556 L1110,578 L1142,578" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1100" y="571" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="end">reloads: the card moves here too</text><path d="M635,600 L397,600" fill="none" stroke="#7e91a8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/><text x="515" y="592" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="400" fill="#9fb0c3" text-anchor="middle">Result</text><path d="M385,636 L147,636" fill="none" stroke="#7e91a8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/><text x="265" y="628" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="400" fill="#9fb0c3" text-anchor="middle">200 + card, new row version</text><rect x="40" y="668" width="910" height="124" rx="8" fill="none" stroke="#e2ab6d" stroke-opacity="0.7"/><path d="M40,668 L88,668 L88,682 L80,690 L40,690" fill="#172436" stroke="#e2ab6d" stroke-opacity="0.7"/><text x="50" y="684" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="700" fill="#e2ab6d" text-anchor="start">alt</text><text x="98" y="684" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="400" fill="#e2ab6d" text-anchor="start">[someone saved first]</text><path d="M885,714 L647,714" fill="none" stroke="#7e91a8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/><text x="765" y="706" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="400" fill="#9fb0c3" text-anchor="middle">0 rows: concurrency exception</text><path d="M385,748 L147,748" fill="none" stroke="#7e91a8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/><text x="265" y="740" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="400" fill="#9fb0c3" text-anchor="middle">409 Conflict</text><path d="M145,758 L180,758 L180,780 L148,780" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="190" y="773" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="start">reload, show their version</text>
</svg>
