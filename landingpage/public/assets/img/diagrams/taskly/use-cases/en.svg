<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 990" width="1280" height="990" role="img" aria-labelledby="t d">
<title id="t">Taskly · Use cases</title>
<desc id="d">Use case diagram of Taskly. A visitor registers and logs in. A user, on a trial, full or read-only licence, manages projects and issues, tracks time and receives notifications. An administrator uses the admin app to search workbenches, change licences, delete users and repair data. Background services send reminders and digests, expire trials, clean up deletions and process uploads, and they notify users.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
<rect width="1280" height="990" rx="18" fill="#0b1119"/>
