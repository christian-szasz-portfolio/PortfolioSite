oke="#4f9bec" stroke-width="1.4"/><text x="460" y="588.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">Attach files</text><ellipse cx="463" cy="633" rx="166" ry="18" fill="#284b72"/><ellipse cx="460" cy="630" rx="166" ry="18" fill="#1d334c" stroke="#4f9bec" stroke-width="1.4"/><text x="460" y="634.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">Track time on a calendar</text><ellipse cx="463" cy="679" rx="166" ry="18" fill="#284b72"/><ellipse cx="460" cy="676" rx="166" ry="18" fill="#1d334c" stroke="#4f9bec" stroke-width="1.4"/><text x="460" y="680.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">See reports and charts</text><rect x="286" y="736" width="360" height="188" rx="12" fill="#426250"/><rect x="280" y="730" width="360" height="188" rx="12" fill="#1a2730" stroke="#8fd39d" stroke-width="1.8"/><text x="298" y="758" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#9fb0c3" text-anchor="start">Stay informed</text><ellipse cx="463" cy="795" rx="166" ry="18" fill="#426250"/><ellipse cx="460" cy="792" rx="166" ry="18" fill="#293d3e" stroke="#8fd39d" stroke-width="1.4"/><text x="460" y="796.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">See teammates’ moves live</text><ellipse cx="463" cy="841" rx="166" ry="18" fill="#426250"/><ellipse cx="460" cy="838" rx="166" ry="18" fill="#293d3e" stroke="#8fd39d" stroke-width="1.4"/><text x="460" y="842.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">Get live notifications</text><ellipse cx="463" cy="887" rx="166" ry="18" fill="#426250"/><ellipse cx="460" cy="884" rx="166" ry="18" fill="#293d3e" stroke="#8fd39d" stroke-width="1.4"/><text x="460" y="888.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">Set notification preferences</text><rect x="666" y="136" width="350" height="280" rx="12" fill="#585073"/><rect x="660" y="130" width="350" height="280" rx="12" fill="#1d2435" stroke="#c3a6ef" stroke-width="1.8"/><text x="678" y="158" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#9fb0c3" text-anchor="start">Operate (admin app)</text><ellipse cx="838" cy="195" rx="161" ry="18" fill="#585073"/><ellipse cx="835" cy="192" rx="161" ry="18" fill="#32354d" stroke="#c3a6ef" stroke-width="1.4"/><text x="835" y="196.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">Search user workbenches</text><ellipse cx="838" cy="241" rx="161" ry="18" fill="#585073"/><ellipse cx="835" cy="238" rx="161" ry="18" fill="#32354d" stroke="#c3a6ef" stroke-width="1.4"/><text x="835" y="242.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">Change a user’s licence</text><ellipse cx="838" cy="287" rx="161" ry="18" fill="#585073"/><ellipse cx="835" cy="284" rx="161" ry="18" fill="#32354d" stroke="#c3a6ef" stroke-width="1.4"/><text x="835" y="288.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">Delete a user and their data</text><ellipse cx="838" cy="333" rx="161" ry="18" fill="#585073"/><ellipse cx="835" cy="330" rx="161" ry="18" fill="#32354d" stroke="#c3a6ef" stroke-width="1.4"/><text x="835" y="334.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, san