="#e2ab6d" stroke-width="1.4"/><text x="835" y="654.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">Clean up scheduled deletions</text><ellipse cx="838" cy="699" rx="161" ry="18" fill="#65523c"/><ellipse cx="835" cy="696" rx="161" ry="18" fill="#373635" stroke="#e2ab6d" stroke-width="1.4"/><text x="835" y="700.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">Process attachment uploads</text><circle cx="135" cy="176" r="11" fill="none" stroke="#e8eef6" stroke-width="1.8"/><path d="M135,187 L135,216 M118,198 L152,198 M135,216 L122,238 M135,216 L148,238" stroke="#e8eef6" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="135" y="260" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#e8eef6" text-anchor="middle">Visitor</text><path d="M160,190 L280,200" stroke="#7e91a8" stroke-width="1.4" fill="none"/><circle cx="135" cy="490" r="11" fill="none" stroke="#e8eef6" stroke-width="1.8"/><path d="M135,501 L135,530 M118,512 L152,512 M135,530 L122,552 M135,530 L148,552" stroke="#e8eef6" stroke-width="1.8" fill="none" stroke-linecap="round"/><text x="135" y="574" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700" fill="#e8eef6" text-anchor="middle">User</text><text x="155" y="468" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="400" fill="#7e91a8" text-anchor="end" font-style="italic">trial, full or read-only</text><path d="M160,504 L280,278" stroke="#7e91a8" stroke-width="1.4" fill="none"/><path d="M160,512 L280,512" stroke="#7e91a8" stroke-width="1.4" fill="none"/><path d="M160,524 L280,770" stroke="#7e91a8" stroke-width="1.4" fill="none"/><circle cx="1160" cy="236" r="11" fill="none" stroke="#e8eef6" stroke-wid