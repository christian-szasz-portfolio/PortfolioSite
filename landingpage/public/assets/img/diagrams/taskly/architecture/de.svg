<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740" role="img" aria-labelledby="t d">
<title id="t">Taskly · Architektur</title>
<desc id="d">Der Browser spricht über HTTPS mit Taskly.Web und erhält Benachrichtigungen über SignalR. Web hängt von Api ab, Api von Logic, Logic von Data und Data von SQL Server. Common und Contracts werden von jeder Schicht referenziert. Eine eigene Admin-App ruft die Produkt-API über HTTP auf. Aspire startet alles lokal, ein Deploy-CLI liefert es aus.</desc>
