="584" rx="166" ry="18" fill="#1d334c" stroke="#4f9bec" stroke-width="1.4"/><text x="460" y="588.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">Compilează, cu log-ul de build live</text><ellipse cx="463" cy="633" rx="166" ry="18" fill="#284b72"/><ellipse cx="460" cy="630" rx="166" ry="18" fill="#1d334c" stroke="#4f9bec" stroke-width="1.4"/><text x="460" y="634.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">Citește diagnosticele și assembly-ul</text><rect x="286" y="690" width="360" height="234" rx="12" fill="#426250"/><rect x="280" y="684" width="360" height="234" rx="12" fill="#1a2730" stroke="#8fd39d" stroke-width="1.8"/><text x="298" y="712" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#9fb0c3" text-anchor="start">Rulează și inspectează</text><ellipse cx="463" cy="749" rx="166" ry="18" fill="#426250"/><ellipse cx="460" cy="746" rx="166" ry="18" fill="#293d3e" stroke="#8fd39d" stroke-width="1.4"/><text x="460" y="750.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">Încarcă assembly-ul în emulator</text><ellipse cx="463" cy="795" rx="166" ry="18" fill="#426250"/><ellipse cx="460" cy="792" rx="166" ry="18" fill="#293d3e" stroke="#8fd39d" stroke-width="1.4"/><text x="460" y="796.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">Pas cu pas, rulare, breakpoint-uri</text><ellipse cx="463" cy="841" rx="166" ry="18" fill="#426250"/><ellipse cx="460" cy="838" rx="166" ry="18" fill="#293d3e" stroke="#8fd39d" stroke-width="1.4"/><text x="460" y="842.5" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5