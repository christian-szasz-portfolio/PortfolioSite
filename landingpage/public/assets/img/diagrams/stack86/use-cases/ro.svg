<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 990" width="1280" height="990" role="img" aria-labelledby="t d">
<title id="t">Stack86 · Cazuri de utilizare</title>
<desc id="d">Diagrama cazurilor de utilizare Stack86. Un vizitator își face cont, își verifică e-mailul și se autentifică, cu autentificare în doi pași și dispozitive de încredere. Un utilizator cu licență trial compilează C; cu licență full, toate cele nouă limbaje. Scrie cod în mai multe fișiere, pornește de la exemple, compilează cu log de build live, citește diagnosticele și assembly-ul, apoi îl încarcă în emulator ca să-l parcurgă pas cu pas, să-l ruleze, să pună breakpoint-uri și să inspecteze registre, flag-uri, stiva și memoria. Toolchain-urile limbajelor verifică fiecare build.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
<rect width="1280" height="990" rx="18" fill="#0b1119"/>
