<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="t d">
<title id="t">Stack86 · Compilation pipeline</title>
<desc id="d">Pipes and filters. Each language runs its own chain of checks: preprocessing, its real toolchain as an outside process, and an 8086 capability check. C++ is transpiled to C and TypeScript to JavaScript, so seven front ends lower everything to one three-address IR. The IR is optimised by copy propagation, validated against the 8086 limits and emitted as 8086 assembly.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
<rect width="1280" height="760" rx="18" fill="#0b1119"/>
<text x="40" y="52" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#e8eef6" text-anchor="start">Stack86</text><text x="40" y="74" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#9fb0c3" text-anchor="start">Nine languages, seven front ends, one intermediate representation, one 8086 back end</text><text x="40" y="112" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9fb0c3" text-anchor="start">Languages</text><text x="220" y="112" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9fb0c3" text-anchor="start">Checks, per language</text><text x="500" y="112" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9fb0c3" text-anchor="start">Front ends</text><text x="740" y="112" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9fb0c3" text-anchor="start">One IR</text><text x="950" y="112" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#9fb0c3" text-anchor="start">Shared back half</text><rect x="226" y="132" width="240" height="564" rx="12" fill="#65523c"/><rect x="220" y="126" width="240" height="564" rx="12" fill="#272a30" stroke="#e2ab6d" stroke-width="1.8"/><text x="238" y="346" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">preprocess: #include, #define</text><text x="238" y="368" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">its own toolchain, outside</text><text x="238" y="390" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">the process (C#: Roslyn)</text><text x="238" y="412" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">8086 capability check</text><rect x="44" y="146" width="140" height="36" rx="18" fill="#2b6068"/><rect x="40" y="142" width="140" height="36" rx="18" fill="#1d3845" stroke="#56cdd6" stroke-width="1.8"/><text x="110" y="165" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" font-weight="700" fill="#e8eef6" text-anchor="middle">C++</text><path d="M180,160 L216,160" fill="none" stroke="#7e91a8" stroke-width="1.6" marker-end="url(#arrow-muted)"/><path d="M460,160 L520,160 L520,198" fill="none" stroke="#7e91a8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/><rect x="532" y="146" width="150" height="28" rx="14" fill="none" stroke="#e2ab6d" stroke-dasharray="4 4"/><text x="607" y="165" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="400" fill="#e2ab6d" text-anchor="middle">C++ → C</text><rect x="44" y="208" width="140" height="36" rx="18" fill="#2b6068"/><rect x="40" y="204" width="140" height="36" rx="18" fill="#1d3845" stroke="#56cdd6" stroke-width="1.8"/><text x="110" y="227" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="13" font-weight="700" fill="#e8eef6" text-anchor="middle">C</text><path d="M180,222 L216,222" fill="none" stroke="#7e91a8" stroke-width="1.6" marker-end="url(#arrow-muted)"/><path d="M460,222 L496,222" fill="none" stroke="#7e91a8" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="504" y="206" width="190" height="40" rx="8" fill="#284b72"/><rect x="500" y="202" width="190" height="40" rx="8" fill="#18293d" stroke="#4f9bec" stroke-width="1.8"/><text x="595" y="227" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font