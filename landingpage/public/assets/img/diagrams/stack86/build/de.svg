<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-labelledby="t d">
<title id="t">Stack86 · Ein Build</title>
<desc id="d">Sequenzdiagramm. Die Compiler-Workbench schickt die Dateien an den Streaming-Endpunkt. Lizenz, Scope, Rate Limit und die Sprachregel für Trials werden geprüft, dann läuft die Pipeline. Jede Toolchain-Prüfung läuft als eigener Prozess hinter Circuit Breaker, Retry und Timeout. Build-Log-Zeilen kommen als NDJSON zurück, während die Stufen laufen, Assembler-Code und Diagnosen zuletzt. Der Editor lädt den Code in den Emulator, der jeden Schritt lokal ausführt und meldet, was er berührt hat. Fällt eine Toolchain wiederholt aus, öffnet der Circuit und der Build scheitert sofort mit einer klaren Meldung.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
