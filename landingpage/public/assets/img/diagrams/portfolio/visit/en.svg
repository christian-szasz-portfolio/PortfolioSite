<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="t d">
<title id="t">Portfolio · One visit</title>
<desc id="d">Sequence diagram. The browser asks the host for the address, for example the German CV, and receives the prerendered page with a content security policy hashed for that build. Angular hydrates the markup instead of drawing it again. Nothing reaches the API until the reader accepts the consent banner. With consent, the page posts one view a day; the API resolves the country from the request itself, buffers the count for Azure Table storage and answers with the totals. Interactions follow in batches, as a keepalive request that outlives the page. If the API does not answer, the page shows an information banner and carries on.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
<rect width="1280" height="760" rx="18" fill="#0b1119"/>
