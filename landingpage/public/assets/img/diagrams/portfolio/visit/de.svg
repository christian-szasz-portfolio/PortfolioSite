ght="316" rx="2" fill="#244264" stroke="#4f9bec" stroke-width="1.8"/><rect x="888" y="367" width="10" height="188" rx="2" fill="#284b72"/><rect x="885" y="364" width="10" height="188" rx="2" fill="#244264" stroke="#4f9bec" stroke-width="1.8"/><rect x="1148" y="439" width="10" height="30" rx="2" fill="#284b72"/><rect x="1145" y="436" width="10" height="30" rx="2" fill="#244264" stroke="#4f9bec" stroke-width="1.8"/><path d="M145,184 L383,184" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="265" y="176" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="400" fill="#e8eef6" text-anchor="middle">GET /de-DE/cv</text><path d="M385,222 L147,222" fill="none" stroke="#7e91a8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/><text x="265" y="214" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="middle">vorgerendertes HTML + CSP</text><path d="M645,252 L680,252 L680,274 L648,274" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="690" y="267" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="start">hydrieren, Markup behalten</text><path d="M645,306 L680,306 L680,328 L648,328" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="690" y="321" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="start">Consent-Banner: zugestimmt</text><path d="M645,372 L883,372" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="765" y="364" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="400" fill="#e8eef6" text-anchor="middle">POST /api/views, einmal am Tag</text><path d="M895,382 L930,382 L930,404 L898,404" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="940" y="397" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="start">Land aus der Anfrage</text><path d="M895,444 L1143,444" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1020" y="436" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#e8eef6" text-anchor="middle">gepuffert, dann geschrieben</text><path d="M885,492 L647,492" fill="none" stroke="#7e91a8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/><text x="765" y="484" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="400" fill="#9fb0c3" text-anchor="middle">{ total, countries }</text><path d="M645,540 L883,540" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="765" y="532" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="10.5" font-weight="400" fill="#e8eef6" text-anchor="middle">POST /api/interactions (keepalive)</text><rect x="40" y="596" width="910" height="110" rx="8" fill="none" stroke="#e2ab6d" stroke-opacity="0.7"/><path d="M40,596 L88,596 L88,610 L80,618 L40,618" fill="#172436" stroke="#e2ab6d" stroke-opacity="0.7"/><text x="50" y="612" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="700" fill="#e2ab6d" text-anchor="start">alt</text><text x="98" y="612" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" font-weight="400" fill="#e2ab6d" text-anchor="start">[die API antwortet nicht]</text><path d="M645,648 L680,648 L680,670 L648,670" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="690" y="663" font-family="'Segoe UI', Inter, system-ui, -apple-system, san