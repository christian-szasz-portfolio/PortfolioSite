<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="t d">
<title id="t">Portfolio · Ein Besuch</title>
<desc id="d">Sequenzdiagramm. Der Browser fragt den Host nach der Adresse, etwa dem deutschen Lebenslauf, und bekommt die vorgerenderte Seite mit einer Content Security Policy, deren Hashes zu diesem Build gehören. Angular hydriert das Markup, statt es neu zu zeichnen. Bis der Leser dem Consent-Banner zustimmt, erreicht nichts die API. Mit Einwilligung sendet die Seite einen Besuch pro Tag; die API ermittelt das Land aus der Anfrage selbst, puffert die Zählung für Azure Table Storage und antwortet mit den Summen. Interaktionen folgen gebündelt, als Keepalive-Anfrage, die die Seite überdauert. Antwortet die API nicht, zeigt die Seite ein Info-Banner und läuft weiter.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
<rect width="1280" height="760" rx="18" fill="#0b1119"/>
