<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-labelledby="t d">
<title id="t">Portfolio · Build-ul</title>
<desc id="d">Diagramă de pipeline. Studiile de caz sunt date TypeScript tipizate, iar fiecare text are un id de mesaj stabil; traducerile în germană și română sunt fișiere JSON, iar una lipsă pică build-ul. Angular construiește fiecare limbă separat și prerandează fiecare rută: nouă rute în trei limbi. Apoi trei unelte rulează peste rezultat: sitemap-ul e citit din paginile construite, stilurile adăugate la runtime sunt colectate într-un browser real, iar configurația host-ului e scrisă cu o politică de securitate a conținutului cu hash-uri pentru build-ul respectiv. La final rezultă un folder de fișiere pentru Azure Static Web Apps.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
<rect width="1280" height="620" rx="18" fill="#0b1119"/>
