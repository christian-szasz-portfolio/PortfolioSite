#e8eef6" text-anchor="start">ng build</text><text x="378" y="312" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">un build per limbă</text><text x="378" y="331" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">o traducere lipsă îl pică</text><path d="M495,358 L495,396" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="366" y="406" width="270" height="96" rx="10" fill="#284b72"/><rect x="360" y="400" width="270" height="96" rx="10" fill="#18293d" stroke="#4f9bec" stroke-width="1.8"/><text x="378" y="428" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="start">prerender</text><text x="378" y="450" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">9 rute × 3 limbi</text><text x="378" y="469" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">27 de pagini de HTML real</text><path d="M630,448 L652,448 L652,184 L676,184" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="686" y="142" width="280" height="96" rx="10" fill="#65523c"/><rect x="680" y="136" width="280" height="96" rx="10" fill="#272a30" stroke="#e2ab6d" stroke-width="1.8"/><text x="698" y="164" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="start">sitemap</text><text x="698" y="186" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">citit din paginile construite</text><text x="698" y="205" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">fiecare pagină o dată pe limbă</text><path d="M820,232 L820,258" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="686" y="268" width="280" height="96" rx="10" fill="#65523c"/><rect x="680" y="262" width="280" height="96" rx="10" fill="#272a30" stroke="#e2ab6d" stroke-width="1.8"/><text x="698" y="290" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="start">style-hashes</text><text x="698" y="312" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">stiluri adăugate la runtime,</text><text x="698" y="331" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">colectate într-un browser real</text><path d="M820,358 L820,384" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="686" y="394" width="280" height="96" rx="10" fill="#65523c"/><rect x="680" y="388" width="280" height="96" rx="10" fill="#272a30" stroke="#e2ab6d" stroke-width="1.8"/><text x="698" y="416" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="start">headers</text><text x="698" y="438" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">staticwebapp.config.json</text><text x="698" y="457" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">CSP cu hash-uri pentru build</text><path d="M960,436 L1006,436" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M1016,396 L1206,396 L1221,411 L1221,486 L101