<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-labelledby="t d">
<title id="t">Portfolio · Der Build</title>
<desc id="d">Pipeline-Diagramm. Die Fallstudien sind typisierte TypeScript-Daten, jeder Text trägt eine feste Message-ID; die deutsche und die rumänische Übersetzung sind JSON-Dateien, und eine fehlende lässt den Build scheitern. Angular baut jede Sprache für sich und rendert jede Route vor: neun Routen in drei Sprachen. Danach laufen drei Werkzeuge über das Ergebnis: Die Sitemap wird aus den gebauten Seiten gelesen, zur Laufzeit hinzugefügte Styles werden in einem echten Browser gesammelt, und die Host-Konfiguration wird mit einer Content Security Policy geschrieben, deren Hashes zu genau diesem Build gehören. Heraus kommt ein Ordner voller Dateien für Azure Static Web Apps.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
<rect width="1280" height="620" rx="18" fill="#0b1119"/>
