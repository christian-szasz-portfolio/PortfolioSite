<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-labelledby="t d">
<title id="t">Portfolio · The build</title>
<desc id="d">Pipeline diagram. The case studies are typed TypeScript data whose strings carry stable message ids; the German and Romanian translations are JSON files, and a missing one fails the build. Angular builds each language on its own and prerenders every route, nine routes in three languages. Three build tools then run over the output: the sitemap is read from the pages that were built, styles injected at runtime are collected in a real browser, and the host configuration is written with a content security policy hashed for this build. What comes out is a folder of files for Azure Static Web Apps.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
