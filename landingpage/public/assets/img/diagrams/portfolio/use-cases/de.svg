<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-labelledby="t d">
<title id="t">Portfolio · Anwendungsfälle</title>
<desc id="d">Anwendungsfalldiagramm der Portfolio-Seite. Ein Leser sieht sich vier Fallstudien an, öffnet den Lebenslauf und lädt ihn als PDF herunter und wechselt Sprache und Design. Der Leser stimmt der Nutzungsstatistik zu oder lehnt sie ab und kann die Hinweise zu Cookies und Datenschutz lesen. Nur mit Einwilligung zählt die Analytics-API einen Besuch pro Browser und Tag und erfasst Interaktionen gebündelt. Der Betreiber sieht die gesammelten Zahlen in einem Dashboard und erhält morgens eine Zusammenfassung per E-Mail.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
