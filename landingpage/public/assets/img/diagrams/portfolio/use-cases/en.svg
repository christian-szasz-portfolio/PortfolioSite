<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" role="img" aria-labelledby="t d">
<title id="t">Portfolio · Use cases</title>
<desc id="d">Use case diagram of the portfolio site. A reader browses four case studies, opens the CV and downloads it as a PDF, and switches language and theme. The reader accepts or declines usage statistics and can read the cookies and privacy notices. Only with consent does the analytics API count one view a day per browser and record interactions in batches. The owner reviews the collected figures in a dashboard and receives a morning digest by email.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
