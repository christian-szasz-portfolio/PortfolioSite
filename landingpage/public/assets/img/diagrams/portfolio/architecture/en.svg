<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740" role="img" aria-labelledby="t d">
<title id="t">Portfolio · Architecture</title>
<desc id="d">The reader’s browser loads prerendered pages from Azure Static Web Apps, and Angular hydrates them. Only with consent does the page call the analytics API on its own origin over HTTPS. The API is a Container App scaled to zero: Analytics.Api handles the request, Analytics.Domain holds the counting policy and Analytics.Infrastructure writes to Azure Table storage. A scheduled job wakes the API each morning for the digest email. The admin dashboard reads the same table from the owner’s machine, and the shared Common packages come from a private package feed.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
<rect width="1280" height="740" rx="18" fill="#0b1119"/>
<text x="40" y="52" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#e8eef6" text-anchor="start">Portfolio</text><text x="40" y="74" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#9fb0c3" text-anchor="start">A static site that stands on its own, and an API it can do without</text><path d="M340,96 L340,700" stroke="#e2ab6d" stroke-width="1.4" stroke-dasharray="7 6" stroke-opacity="0.8"/><text x="340" y="716" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11" font-weight="400" fill="#e2ab6d" text-anchor="middle">static | API</text><rect x="46" y="116" width="270" height="118" rx="10" fill="#2b6068"/><rect x="40" y="110" width="270" height="118" rx="10" fill="#192e3a" stroke="#56cdd6" stroke-width="1.8"/><text x="58" y="138" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="start">Browser</text><text x="58" y="160" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">prerendered HTML, EN · DE · RO</text><text x="58" y="179" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">Angular hydrates, no redraw</text><text x="58" y="198" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">calls the API only with consent</text><rect x="46" y="336" width="270" height="118" rx="10" fill="#2b6068"/><rect x="40" y="330" width="270" height="118" rx="10" fill="#192e3a" stroke="#56cdd6" stroke-width="1.8"/><text x="58" y="358" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="start">Static Web Apps</text><text x="58" y="380" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">27 prerendered pages</text><text x="58" y="399" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">CSP hashed per build</text><text x="58" y="418" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">no server code of its own</text><path d="M175,326 L175,232" fill="none" stroke="#56cdd6" stroke-width="1.6" marker-end="url(#arrow-teal)"/><text x="185" y="286" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="400" fill="#56cdd6" text-anchor="start">pages</text><text x="40" y="500" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#9fb0c3" text-anchor="start" font-style="italic">The page never waits for the API:</text><text x="40" y="520" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#9fb0c3" text-anchor="start" font-style="italic">with no answer, there is no counter.</text><rect x="386" y="106" width="460" height="88" rx="10" fill="#284b72"/><rect x="380" y="100" width="460" height="88" rx="10" fill="#18293d" stroke="#4f9bec" stroke-width="1.8"/><text x="398" y="128" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="start">Analytics.Api</text><text x="398" y="150" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">FastEndpoints · CORS · rate limit</text><text x="398" y="169" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">/api/views · /api/interactions</text><rect x="386" y="226" width="460" height="88" rx="10" fill="#284b72"/><rect x="380" y="220" width="460" height="88" rx="10" fill="#18293d" stroke="#4f9bec" stroke-width="1.8"/><text x="398" y="248" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="start">Analytics.Domain</text><text x="398" y="270" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">counting policy and contracts</text><text x="398" y="289" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">references no package at all</text><rect x="386" y="346" width="460" height="88" rx="10" fill="#284b72"/><rect x="380" y="340" width="460" height="88" rx="10" fill="#18293d" stroke="#4f9bec" stroke-width="1.8"/><text x="398" y="368" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="start">Analytics.Infrastructure</text><text x="398" y="390" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">Azure Table · DB-IP country lookup</text><text x="398" y="409" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">write-behind buffers</text><path d="M610,188 L610,218" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M610,308 L610,338" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M610,428 L610,476" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M516,498 L516,562 A100,16 0 0 0 716,562 L716,498 A100,16 0 0 0 516,498" fill="#426250"/><path d="M510,492 L510,556 A100,16 0 0 0 710,556 L710,492" fill="#1f2e35" stroke="#8fd39d" stroke-width="1.8"/><ellipse cx="610" cy="492" rx="100" ry="16" fill="#304845" stroke="#8fd39d" stroke-width="1.8"/><text x="610" y="540" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="middle">Azure Table</text><path d="M310,146 L376,146" fill="none" stroke="#4f9bec" stroke-width="1.6" marker-end="url(#arrow)"/><text x="343" y="138" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="10.5" font-weight="400" fill="#7e91a8" text-anchor="middle">HTTPS</text><rect x="906" y="106" width="340" height="96" rx="10" fill="#65523c"/><rect x="900" y="100" width="340" height="96" rx="10" fill="#272a30" stroke="#e2ab6d" stroke-width="1.8"/><text x="918" y="128" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="start">Wake job</text><text x="918" y="150" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">06:00 and 07:00 UTC</text><text x="918" y="169" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">POST /internal/digest</text><path d="M896,148 L844,148" fill="none" stroke="#7e91a8" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="906" y="236" width="340" height="96" rx="10" fill="#65523c"/><rect x="900" y="230" width="340" height="96" rx="10" fill="#272a30" stroke="#e2ab6d" stroke-width="1.8"/><text x="918" y="258" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="start">Morning digest</text><text x="918" y="280" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">views and warnings, by email</text><text x="918" y="299" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">sent once: the day is claimed first</text><path d="M844,176 L870,176 L870,278 L896,278" fill="none" stroke="#7e91a8" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="906" y="406" width="340" height="96" rx="10" fill="#585073"/><rect x="900" y="400" width="340" height="96" rx="10" fill="#242a3d" stroke="#c3a6ef" stroke-width="1.8"/><text x="918" y="428" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="start">Admin</text><text x="918" y="450" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">dashboard over the same table</text><text x="918" y="469" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">runs on the owner’s machine</text><path d="M896,448 L720,508" fill="none" stroke="#7e91a8" stroke-width="1.6" marker-end="url(#arrow-muted)"/><rect x="906" y="566" width="340" height="96" rx="10" fill="#426250"/><rect x="900" y="560" width="340" height="96" rx="10" fill="#1f2e35" stroke="#8fd39d" stroke-width="1.8"/><text x="918" y="588" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="15" font-weight="700" fill="#e8eef6" text-anchor="start">Common</text><text x="918" y="610" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">security, diagnostics, HTML</text><text x="918" y="629" font-family="'Segoe UI', Inter, system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="400" fill="#9fb0c3" text-anchor="start">from a private package feed</text>
</svg>
