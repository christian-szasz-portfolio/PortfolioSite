<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740" role="img" aria-labelledby="t d">
<title id="t">Portfolio · Arhitectură</title>
<desc id="d">Browserul cititorului încarcă pagini prerandate din Azure Static Web Apps, iar Angular le hidratează. Doar cu acord, pagina apelează API-ul de analytics, pe originea lui, prin HTTPS. API-ul e un Container App care scalează la zero: Analytics.Api tratează cererea, Analytics.Domain ține politica de numărare, iar Analytics.Infrastructure scrie în Azure Table. Un job programat trezește API-ul în fiecare dimineață pentru rezumatul pe e-mail. Dashboard-ul de admin citește același tabel de pe calculatorul proprietarului, iar pachetele Common vin dintr-un feed privat de pachete.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f9bec"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7e91a8"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56cdd6"/></marker>
</defs>
<rect width="1280" height="740" rx="18" fill="#0b1119"/>
